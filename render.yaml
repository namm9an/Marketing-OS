services:
  - type: web
    name: marketing-os
    runtime: docker
    plan: free
    branch: feat/frontend-overhaul
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET_KEY
        sync: false
      - key: TRUST_FORWARDED_FOR
        value: "false"
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: "production"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # GEMINI_API_KEY intentionally unset so the app runs in mock mode
