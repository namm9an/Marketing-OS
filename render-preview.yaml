# Proposed review service only. This file does not change the existing service
# or deploy anything until the owner creates/approves a service in Render.
services:
  - type: web
    name: marketing-os-review
    runtime: docker
    plan: free
    branch: feat/frontend-overhaul
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: "production"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_FORWARDED_FOR
        value: "false"
      - key: ADMIN_USER
        value: "reviewer"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: "/tmp/marketing-os-review.db"
      - key: ALLOWED_ORIGINS
        sync: false
